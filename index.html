<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>funny.kkoreng</title>
    <meta name="description" content="" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤪</text></svg>" />
    <style>
      :root {
        --bg: #fff8ec;
        --fg: #1d1a16;
        --muted: #7a6f60;
        --card: #ffffff;
        --border: #f0e2c8;
        --accent: #ffb703;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15130f;
          --fg: #f5efe4;
          --muted: #a89c8a;
          --card: #1f1c17;
          --border: #332d24;
          --accent: #ffc94a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Pretendard", "Noto Sans KR", sans-serif;
      }
      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 64px 16px 48px;
      }
      h1 {
        margin: 0;
        font-size: clamp(32px, 7vw, 52px);
        letter-spacing: -0.03em;
      }
      h1 span {
        color: var(--accent);
      }
      .lead {
        margin: 8px 0 40px;
        color: var(--muted);
        font-size: 17px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }
      .card {
        display: block;
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .card:hover {
        transform: translateY(-4px) rotate(-0.6deg);
        box-shadow: 0 10px 30px rgba(255, 183, 3, 0.25);
      }
      .emoji {
        font-size: 40px;
        line-height: 1;
      }
      .card h2 {
        margin: 14px 0 6px;
        font-size: 19px;
      }
      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }
      .path {
        margin-top: 14px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
        color: var(--accent);
      }
      footer {
        margin-top: 56px;
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>funny<span>.</span>kkoreng</h1>
      <div class="grid" id="projects"></div>
    </main>

    <script>
      // 새 프로젝트를 추가하면 여기에도 한 줄 추가 (vercel.json rewrite도 잊지 말기)
      const PROJECTS = [
        {
          path: "/shine-my-bald",
          emoji: "✨",
          title: "대머리 광택 시뮬레이터",
          desc: "카메라 속 아저씨 머리를 손으로 문지르면 점점 반짝반짝. 너무 문지르면 태양이 됩니다.",
        },
      ];

      const grid = document.getElementById("projects");
      for (const p of PROJECTS) {
        const a = document.createElement("a");
        a.className = "card";
        a.href = p.path;
        const emoji = document.createElement("div");
        emoji.className = "emoji";
        emoji.textContent = p.emoji;
        const h2 = document.createElement("h2");
        h2.textContent = p.title;
        const desc = document.createElement("p");
        desc.textContent = p.desc;
        const path = document.createElement("div");
        path.className = "path";
        path.textContent = p.path;
        a.append(emoji, h2, desc, path);
        grid.append(a);
      }
    </script>
  </body>
</html>
